workflows:
  build-apk:
    name: Build APK Aulas
    environment:
      # Usa a versão estável mais recente, que é compatível com o Gradle 9+
      flutter: stable 
    scripts:
      - name: Obter dependências
        script: flutter pub get
      - name: Compilar APK
        script: flutter build apk --release --split-per-abi
    artifacts:
      - build/app/outputs/flutter-apk/*.apk