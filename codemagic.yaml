workflows:
  build-apk-alunos:
    name: Build APK Aulas (Versão Estável)
    environment:
      # FIXAR a versão evita bugs de templates recentes. 
      # A 3.27.4 é extremamente estável e compatível.
      flutter: 3.27.4 
    scripts:
      - name: 🪄 Correção Forçada de Versões
        script: |
          echo "=== INÍCIO DA CORREÇÃO ==="
          
          # 1. Atualizar Gradle para 9.5.0 (como o aviso pede)
          sed -i 's/gradle-.*-all\.zip/gradle-9.5.0-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties
          
          # 2. Substituir EXATAMENTE a versão 9.1.0 pela 9.2.0 nos ficheiros .kts
          sed -i 's/version "9\.1\.0"/version "9.2.0"/g' android/settings.gradle.kts
          sed -i 's/version "9\.1\.0"/version "9.2.0"/g' android/build.gradle.kts
          
          # 3. Fallback para ficheiros .gradle antigos (sem .kts)
          sed -i "s/version '9\.1\.0'/version '9.2.0'/g" android/settings.gradle
          sed -i "s/version '9\.1\.0'/version '9.2.0'/g" android/build.gradle
          
          echo "=== VERIFICAÇÃO: Conteúdo atualizado ==="
          echo "--- gradle-wrapper.properties ---"
          cat android/gradle/wrapper/gradle-wrapper.properties | grep distributionUrl
          echo "--- settings.gradle.kts (linhas com com.android) ---"
          grep "com.android.application" android/settings.gradle.kts || echo "Não encontrado em settings.gradle.kts"
          echo "--- build.gradle.kts (linhas com com.android) ---"
          grep "com.android.application" android/build.gradle.kts || echo "Não encontrado em build.gradle.kts"
          echo "=== FIM DA CORREÇÃO ==="

      - name: Instalar dependências
        script: flutter pub get
        
      - name: Compilar APK
        script: flutter build apk --release --split-per-abi
        
    artifacts:
      - build/app/outputs/flutter-apk/*.apk