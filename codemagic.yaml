workflows:
  build-apk:
    name: Build APK Aulas
    environment:
      # Usa a versão estável mais recente, que é compatível com o Gradle 9+
      flutter: stable 
    scripts:
      - name: Build Android APK
        script: |
          flutter packages pub get
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk