name: Build APK (Sala de Aula - Definitivo)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Obter o código
        uses: actions/checkout@v4
      
      - name: 2. Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: 3. Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
      
      - name: 4. Instalar dependências
        run: flutter pub get
      
      - name: 5. Harmonizar Gradle e AGP
        # Este passo garante que tanto o Gradle como o Plugin do Android 
        # estão em versões compatíveis (8.9 e 8.3.2), evitando todos os erros anteriores.
        run: |
          echo "A harmonizar versões do Android Build..."
          
          # 1. Forçar Gradle 8.9
          sed -i 's/gradle-.*\.zip/gradle-8.9-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties
          
          # 2. Forçar Android Gradle Plugin (AGP) para 8.3.2 no ficheiro .kts (se existir)
          sed -i 's/id("com\.android\.application") version "[0-9.]*"/id("com.android.application") version "8.3.2"/g' android/build.gradle.kts
          sed -i 's/id("com\.android\.application") version "[0-9.]*"/id("com.android.application") version "8.3.2"/g' android/app/build.gradle.kts
          
          # 3. Forçar Android Gradle Plugin (AGP) para 8.3.2 no ficheiro .gradle (se existir)
          sed -i 's/classpath.*com\.android\.tools\.build:gradle:.*/classpath "com.android.tools.build:gradle:8.3.2"/g' android/build.gradle
          
          echo "Configuração aplicada com sucesso!"
      
      - name: 6. Compilar APK
        run: flutter build apk --release --split-per-abi
      
      - name: 7. Guardar o APK para download
        uses: actions/upload-artifact@v4
        with:
          name: APK-Para-Alunos
          path: build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 7